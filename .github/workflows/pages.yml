name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Web + WASM Static Site
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack & wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen-cli@0.2.130

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build WASM & Vite static site
        working-directory: web
        run: |
          npm ci
          npm run build:wasm
          npm run build
          touch dist/.nojekyll

      - name: Check whether GitHub Pages is enabled on repository
        id: check_pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages 尚未启用"
              echo "当前仓库尚未启用 GitHub Pages（私有仓库在 GitHub Free 计划下无法开启 Pages；将仓库改为 Public 或升级计划后，前往 **Settings → Pages → Source: GitHub Actions** 启用并重新运行本工作流即可上线）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GitHub Pages artifact
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy-pages:
    name: Publish to GitHub Pages
    needs: build-pages
    if: needs.build-pages.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
