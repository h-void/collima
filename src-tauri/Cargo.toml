[package]
name = "collima"
version = "0.1.0"
description = "Camera sensor read-noise & lens optical focal-plane tilt diagnostics workbench"
authors = ["h-void"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/h-void/collima"
edition = "2021"

[lib]
name = "collima_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
