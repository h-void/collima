[workspace]
resolver = "2"
members = [
    "crates/collima-core",
]
exclude = [
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/h-void/collima"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
